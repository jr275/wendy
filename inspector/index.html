<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menlo / Remax AI Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ---------- Design tokens: light (grid paper + mint) / dark (control tower) ---------- */
  :root {
    --bg: #efefec; --grid: rgba(20, 20, 20, .045); --panel: #ffffff; --panel-2: #f7f7f5;
    --ink: #141414; --ink-2: #3d3d3a; --muted: #6e6e69; --faint: #9a9a94;
    --line: #d8d8d3; --line-2: #ebebe7; --line-strong: #141414;
    --mint: #1b9e72; --mint-ink: #0b6b4b; --mint-bg: #cdf3e2; --mint-bg-2: #e6f8ef;
    --warn: #a35b00; --warn-bg: #fbeed6; --bad: #b42318; --bad-bg: #fbe4e1; --info: #2f5bd3; --info-bg: #e3e9fb;
    --btn: #141414; --btn-ink: #ffffff; --chip: #f1f1ee;
    --sans: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 4px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1d20; --grid: rgba(255,255,255,.035); --panel: #23262a; --panel-2: #1f2125; --ink: #ecece8; --ink-2: #c9c9c4; --muted: #9b9c98; --faint: #707270; --line: #363a3f; --line-2: #2c2f34; --line-strong: #ecece8; --mint: #5fd3a6; --mint-ink: #7fe3bb; --mint-bg: rgba(95,211,166,.16); --mint-bg-2: rgba(95,211,166,.08); --warn: #f0b45a; --warn-bg: rgba(240,180,90,.13); --bad: #ff7b6e; --bad-bg: rgba(255,123,110,.13); --info: #8aa8ff; --info-bg: rgba(138,168,255,.13); --btn: #5fd3a6; --btn-ink: #0f1a15; --chip: #2b2e33; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1b1d20; --grid: rgba(255,255,255,.035); --panel: #23262a; --panel-2: #1f2125; --ink: #ecece8; --ink-2: #c9c9c4; --muted: #9b9c98; --faint: #707270; --line: #363a3f; --line-2: #2c2f34; --line-strong: #ecece8; --mint: #5fd3a6; --mint-ink: #7fe3bb; --mint-bg: rgba(95,211,166,.16); --mint-bg-2: rgba(95,211,166,.08); --warn: #f0b45a; --warn-bg: rgba(240,180,90,.13); --bad: #ff7b6e; --bad-bg: rgba(255,123,110,.13); --info: #8aa8ff; --info-bg: rgba(138,168,255,.13); --btn: #5fd3a6; --btn-ink: #0f1a15; --chip: #2b2e33; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; color: inherit; }
  .mono, .eyebrow, th, .tag, .pill, .kpi .l, .kpi .s, .label { font-family: var(--mono); }

  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .side { position: static !important; height: auto !important; } }

  /* Sidebar */
  .side { position: sticky; top: 0; height: 100vh; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 12px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 6px; }
  .brand .mark { width: 26px; height: 26px; border-radius: 3px; background: var(--ink); color: var(--panel); display: grid; place-items: center; font: 600 13px var(--mono); }
  .brand .b1 { font-weight: 650; font-size: 14px; letter-spacing: -.1px; display: block; }
  .brand .b2 { font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: .6px; text-transform: uppercase; display: block; }
  .ws { border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; display: flex; align-items: center; gap: 8px; background: var(--panel-2); }
  .ws .avatar { width: 20px; height: 20px; border-radius: 2px; background: var(--mint-bg); color: var(--mint-ink); display: grid; place-items: center; font: 600 10px var(--mono); flex: none; }
  .ws select { border: 0; background: transparent; font: 600 13px var(--sans); color: var(--ink); width: 100%; outline: none; cursor: pointer; }
  .navlabel { font: 500 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--faint); padding: 8px 10px 2px; }
  nav { display: flex; flex-direction: column; gap: 1px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r); color: var(--ink-2); font-size: 13.5px; }
  nav a:hover { background: var(--panel-2); }
  nav a.on { background: var(--mint-bg); color: var(--mint-ink); font-weight: 600; }
  nav a .count { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }
  nav a.on .count { color: var(--mint-ink); }
  nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .side .spacer { flex: 1; }
  .side .foot { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .side .src { font: 500 10px var(--mono); letter-spacing: .8px; text-transform: uppercase; color: var(--faint); padding: 0 6px; }
  .side .src select { font: 12px var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r); padding: 3px 4px; background: var(--panel-2); max-width: 100%; margin-top: 4px; }
  .theme { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 0 6px; }
  .theme button { flex: 1; border: 0; background: transparent; padding: 5px 0; font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .theme button.on { background: var(--ink); color: var(--panel); }
  .me { display: flex; align-items: center; gap: 8px; padding: 2px 6px; }
  .me .avatar { width: 28px; height: 28px; border-radius: 3px; background: var(--ink); color: var(--panel); display: grid; place-items: center; font: 600 11px var(--mono); }
  .me .n { font-weight: 600; font-size: 13px; } .me .s { font: 10.5px var(--mono); color: var(--muted); }

  /* Main + grid-paper canvas */
  main { min-width: 0; display: flex; flex-direction: column; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 20px 32px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .page-head h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -.4px; }
  .page-head p { margin: 3px 0 0; color: var(--muted); }
  .page-head .back { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: var(--r); display: grid; place-items: center; margin-right: 12px; color: var(--muted); background: var(--panel); }
  .canvas { flex: 1; padding: 26px 32px 64px; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .narrow { max-width: 900px; }

  .notice { display: flex; gap: 10px; align-items: flex-start; padding: 9px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); font-size: 13px; margin-bottom: 20px; }
  .notice b { font-weight: 650; }

  .eyebrow { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .brief { font-size: 27px; line-height: 1.28; font-weight: 500; letter-spacing: -.6px; margin: 8px 0 6px; max-width: 920px; }
  .brief u { text-decoration-color: var(--mint); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .brief-meta { color: var(--faint); font: 11.5px var(--mono); }

  /* Control-tower KPI strip */
  .tower { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); margin: 22px 0 26px; }
  @media (max-width: 900px) { .tower { grid-template-columns: repeat(2, 1fr); } }
  .tower .t { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-right: 1px solid var(--line); }
  .tower .t:last-child { border-right: 0; }
  .tower .ic { width: 36px; height: 36px; border-radius: 3px; background: var(--mint-bg-2); border: 1px solid var(--line); color: var(--mint-ink); display: grid; place-items: center; flex: none; }
  .tower .ic svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .tower .v { font-size: 26px; font-weight: 600; letter-spacing: -.6px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tower .l { font: 500 10.5px var(--mono); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .tower .t.hot .ic { background: var(--warn-bg); color: var(--warn); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin: 22px 0 26px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { padding: 14px 18px; border-right: 1px solid var(--line); }
  .kpi:last-child { border-right: 0; }
  .kpi .v { font-size: 26px; font-weight: 600; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); } .kpi .s { font-size: 11px; color: var(--faint); }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 4px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .bul { list-style: none; padding: 0; margin: 10px 0 0; }
  .bul li { position: relative; padding: 3px 0 9px 18px; }
  .bul li::before { content: ""; position: absolute; left: 0; top: 10px; width: 8px; height: 8px; border: 1.5px solid var(--ink); background: var(--panel); }
  .bul.ok li::before { background: var(--mint); border-color: var(--mint); } .bul.warn li::before { background: var(--warn); border-color: var(--warn); }
  .bul .t { font-weight: 550; } .bul .d { color: var(--muted); font: 11.5px var(--mono); }
  .empty-line { color: var(--faint); font-size: 13px; padding-top: 10px; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; }
  .section-title h2 { font-size: 15px; margin: 0; font-weight: 600; } .section-title h2 span { color: var(--muted); font-weight: 400; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
  .play { padding: 18px 22px; margin-bottom: 12px; display: grid; grid-template-columns: 36px 1fr; gap: 14px; transition: border-color .15s; }
  .play:hover { border-color: var(--line-strong); }
  .rank { width: 30px; height: 30px; border: 1px solid var(--line-strong); color: var(--ink); display: grid; place-items: center; font: 600 13px var(--mono); border-radius: 2px; }
  .rank.first { background: var(--ink); color: var(--panel); }
  .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 11px var(--mono); color: var(--muted); }
  .tag { font-size: 10px; font-weight: 500; letter-spacing: .8px; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; background: var(--chip); color: var(--ink-2); border: 1px solid var(--line); }
  .tag.mint { background: var(--mint-bg); color: var(--mint-ink); border-color: transparent; }
  .tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .tag.info { background: var(--info-bg); color: var(--info); border-color: transparent; }
  .dots { letter-spacing: 1px; color: var(--mint); }
  .play h3 { font-size: 17.5px; margin: 7px 0 6px; font-weight: 600; letter-spacing: -.3px; }
  .lead { color: var(--mint-ink); display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
  .lead svg { flex: none; margin-top: 3px; width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
  .body { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 2px; padding: 3px 8px; color: var(--ink-2); max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip i { font: normal 500 10px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
  .play-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font: 11.5px var(--mono); color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r); padding: 7px 12px; font: 600 13px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: var(--line-strong); }
  .btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .btn.mint { background: var(--mint-bg); border-color: transparent; color: var(--mint-ink); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.on { border-color: var(--line-strong); background: var(--panel-2); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  details.more { margin-top: 18px; } details.more summary { cursor: pointer; color: var(--muted); font: 12px var(--mono); list-style: none; }
  details.more summary::before { content: "+ "; } details.more[open] summary::before { content: "− "; }
  .mini { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); }
  .mini:last-child { border-bottom: 0; } .mini:hover { background: var(--panel-2); }

  /* Tables */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tabs button { border: 1px solid transparent; background: transparent; padding: 5px 10px; border-radius: var(--r); font-size: 13px; color: var(--ink-2); }
  .tabs button .c { font: 11px var(--mono); color: var(--faint); margin-left: 5px; }
  .tabs button.on { background: var(--mint-bg); color: var(--mint-ink); font-weight: 600; }
  .tabs button.on .c { color: var(--mint-ink); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--mono); font-size: 12.5px; } th.num { text-align: right; }
  .pill { font-size: 10px; font-weight: 500; letter-spacing: .8px; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; white-space: nowrap; }
  .pill.mint { background: var(--mint-bg); color: var(--mint-ink); } .pill.info { background: var(--info-bg); color: var(--info); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.grey { background: var(--chip); color: var(--muted); }
  .ttl { font-weight: 550; } .sub { color: var(--muted); font-size: 12.5px; }
  .row-accent { box-shadow: inset 2px 0 0 var(--warn); } .row-accent.bad { box-shadow: inset 2px 0 0 var(--bad); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty h3 { color: var(--ink); margin: 8px 0 4px; font-size: 15px; font-weight: 600; }
  .illo { display: block; margin: 0 auto; color: var(--ink); }
  .illo .m { fill: var(--mint-bg); }

  /* Insight / review proposal */
  .review { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; margin-bottom: 18px; }
  .review .l { display: flex; align-items: center; gap: 10px; }
  .review .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .spark { width: 30px; height: 30px; border-radius: 3px; background: var(--ink); color: var(--panel); display: grid; place-items: center; }
  .spark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  @media (max-width: 1080px) { .detail { grid-template-columns: 1fr; } }
  .narr { font-size: 19px; line-height: 1.5; font-weight: 450; letter-spacing: -.3px; margin: 6px 0 20px; }
  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  @media (max-width: 700px) { .kv { grid-template-columns: 1fr; gap: 4px; } }
  .kv .k { font: 500 10.5px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .claim { margin-bottom: 10px; } .claim:last-child { margin-bottom: 0; }
  .claim .m { font: 11px var(--mono); color: var(--faint); }
  .ev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ev button { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 2px; padding: 3px 8px; color: var(--ink-2); text-align: left; max-width: 100%; }
  .ev button:hover { border-color: var(--line-strong); }
  .evbox { display: none; margin-top: 8px; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); font: 12px/1.55 var(--mono); color: var(--ink-2); white-space: pre-wrap; }
  .evbox.show { display: block; }
  .rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .rail .card { padding: 14px 16px; }
  .rail h4 { margin: 0 0 10px; font: 500 10.5px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .rail h4 svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
  .rail.flash .card.explain { outline: 2px solid var(--mint); }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
  .line:last-child { border-bottom: 0; } .line .l { color: var(--muted); } .line .v { font: 600 12.5px var(--mono); text-align: right; }
  .bar { height: 4px; background: var(--line-2); overflow: hidden; margin-top: 5px; }
  .bar span { display: block; height: 100%; background: var(--mint); }
  .action { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
  .action:last-child { margin-bottom: 0; }
  .action .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .action .h b { font-size: 13px; }
  .mail { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 2px; padding: 8px 10px; white-space: pre-wrap; max-height: 220px; overflow: auto; }
  .row-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .note { font: 11px/1.5 var(--mono); color: var(--faint); margin-top: 6px; }
  .brief-art h5 { margin: 10px 0 4px; font: 500 10.5px var(--mono); letter-spacing: .8px; text-transform: uppercase; } .brief-art ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); }

  /* Logic graph (claims chain) */
  .logic { position: relative; padding: 18px; }
  .logic svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .logic svg.links path { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .55; }
  .lcols { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px; }
  @media (max-width: 1000px) { .lcols { grid-template-columns: 1fr 1fr; } }
  .lcol h5 { margin: 0 0 10px; font: 500 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .node { border: 1px solid var(--line-strong); background: var(--panel); padding: 8px 10px; margin-bottom: 10px; font-size: 12.5px; border-radius: 2px; position: relative; }
  .node .k { font: 500 9.5px var(--mono); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .node.fact { border-color: var(--line); background: var(--panel-2); }
  .node.rec { background: var(--mint-bg); border-color: var(--mint); }

  /* Ontology */

  /* Configuration (onboarding-style, live summary on the right) */

  .summary .big { padding: 18px; border-bottom: 1px solid var(--line); }

  .summary .row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 18px; border-bottom: 1px solid var(--line-2); font-size: 13px; }

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (d) => (d ? new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—');
const fmtDay = (d) => (d ? new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) : '—');
const initials = (n) => (n || '?').split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
const stripRefs = (t) => String(t ?? '').replace(/\s*\[(C\d+)(\]\s*\[C\d+)*\]/g, '').replace(/\s+([.,;:])/g, '$1').trim();
const ICON = {
  logic: '<svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 6c5 0 5 6 10 6M7 18c5 0 5-6 10-6"/></svg>',

  check: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  pen: '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  auto: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
  list: '<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  signal: '<svg viewBox="0 0 24 24"><path d="M4 18a14 14 0 0 1 14-14M4 12a8 8 0 0 1 8-8M4 6h.01"/></svg>',
  trend: '<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  arrow: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>',

  doc: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  box: '<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>',

  shield: '<svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>',

};
const EVENT_TAG = { EMAIL_RECEIVED: ['e-mail', 'info'], COMMITMENT_DUE: ['compromisso', 'warn'], PERSON_DATE_APPROACHING: ['data pessoal', 'mint'], PRINCIPAL_NOTE: ['nota sua', ''], PRINCIPAL_QUESTION: ['pergunta', ''] };
const ACTION_STATE = {

  FAILED: ['falhou', 'bad'], CANCELLED: ['cancelada', 'grey'], EXPIRED: ['expirada', 'grey'],
};

const KIND_PT = { INFERENCE: 'Por que importa', HYPOTHESIS: 'Hipóteses', ANTICIPATION: 'O que espero', RECOMMENDATION: 'O que recomendo' };
const FACTOR = { importance: 'Importância da pessoa', urgency: 'Urgência expressa', relationship_relevance: 'Relevância da relação', business_impact: 'Impacto', novelty: 'Novidade', confidence: 'Confiança', time_sensitivity: 'Prazo', actionability: 'Acionável', executive_preference: 'Suas preferências' };
const REL_PT = { INVESTOR: 'investidor', CLIENT: 'cliente', KEY_CLIENT: 'cliente-chave', COLLEAGUE: 'colega', PARTNER: 'parceiro', FRIEND: 'amigo', FAMILY: 'família' };
const conf = (c) => (c >= 0.75 ? 'confiança alta' : c >= 0.5 ? 'confiança média' : 'confiança baixa');
const confDots = (c) => (c >= 0.75 ? '●●●' : c >= 0.5 ? '●●○' : '●○○');

function illo(kind = 'slab', w = 180) {
  const slab = `<path d="M90 30 L160 65 L90 100 L20 65 Z" fill="none" stroke="currentColor" stroke-width="1"/><path d="M20 65 L20 75 L90 110 L160 75 L160 65" fill="none" stroke="currentColor" stroke-width="1"/>
    ${[1,2,3].map((i) => `<path d="M${20+i*17.5} ${65-i*8.75} L${90+i*17.5} ${100-i*8.75}" stroke="currentColor" stroke-width=".5" opacity=".35"/><path d="M${90-i*17.5} ${30+i*8.75} L${160-i*17.5} ${65+i*8.75}" stroke="currentColor" stroke-width=".5" opacity=".35"/>`).join('')}`;
  const top = kind === 'lock'
    ? `<rect x="76" y="34" width="28" height="22" rx="2" class="m" stroke="currentColor"/><path d="M82 34v-6a8 8 0 0 1 16 0v6" fill="none" stroke="currentColor"/>`
    : kind === 'nodes'
    ? `<circle cx="70" cy="52" r="7" class="m" stroke="currentColor"/><circle cx="110" cy="48" r="7" fill="none" stroke="currentColor"/><circle cx="92" cy="72" r="7" fill="none" stroke="currentColor"/><path d="M76 54l10 13M104 52l-8 14M77 51l26-2" stroke="currentColor" stroke-dasharray="2 2"/>`
    : `<path d="M75 30 L105 45 L105 15 L75 0 Z" class="m" stroke="currentColor"/><path d="M75 30 L75 50 M105 45 L105 62" stroke="currentColor" stroke-dasharray="2 2"/>`;
  return `<svg class="illo" width="${w}" viewBox="0 -10 180 125" aria-hidden="true">${slab}${top}</svg>`;
}

const state = { schema: null, schemas: [], principal: null, principals: [] };
async function api(path, params = {}) {
  const q = new URLSearchParams({ schema: state.schema ?? '', ...(state.principal ? { principal: state.principal } : {}), ...params });
  const r = await fetch(`${path}?${q}`);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const schemaInfo = () => state.schemas.find((s) => s.schema === state.schema);
function sampleNotice() {
  const s = schemaInfo();
  if (s && s.test_double_calls > 0 && s.real_calls === 0)
    return `<div class="notice">⚠ <div><b>Dados de exemplo.</b> Tudo nesta fonte foi raciocinado pelo <b>substituto de teste</b>, não pelo Claude. Serve para ver o fluxo e a mecânica (evidências, validação, prioridade, ações) — não a inteligência da Wendy.</div></div>`;
  if (s && s.test_double_calls > 0) return `<div class="notice">⚠ <div>Esta fonte mistura raciocínio real do Claude e do substituto de teste. Cada item indica qual foi usado.</div></div>`;
  return '';
}
function head(title, sub, right = '', backHref = '') {
  return `<div class="page-head"><div style="display:flex;align-items:flex-start">${backHref ? `<a class="back" href="${backHref}">${ICON.back}</a>` : ''}<div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div></div><div>${right}</div></div>`;
}

function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const eff = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === eff));
}
(() => {
  let saved = null; try { saved = localStorage.getItem('wendy.theme'); } catch {}
  applyTheme(saved);
  document.querySelectorAll('#theme button').forEach((b) => (b.onclick = () => { try { localStorage.setItem('wendy.theme', b.dataset.t); } catch {} applyTheme(b.dataset.t); if (location.hash.startsWith('#/ontologia') || location.hash.startsWith('#/insight')) route(); }));
})();

async function boot() {
  const { schemas } = await api('/api/schemas');
  state.schemas = schemas;
  const sel = $('#schema');
  if (!schemas.length) { $('#main').innerHTML = head('Menlo / Remax AI Platform', '') + '<div class="canvas"><div class="card empty"><h3>Nenhum dado ainda</h3>Rode a Wendy para gerar eventos.</div></div>'; return; }
  sel.innerHTML = schemas.map((s) => `<option value="${esc(s.schema)}">${esc(s.schema)}</option>`).join('');
  state.schema = localStorage.getItem('wendy.schema') && schemas.some((s) => s.schema === localStorage.getItem('wendy.schema')) ? localStorage.getItem('wendy.schema') : schemas[0].schema;
  sel.value = state.schema;
  sel.onchange = async () => { state.schema = sel.value; try { localStorage.setItem('wendy.schema', sel.value); } catch {} await loadPrincipals(); route(); };
  await loadPrincipals();
  window.addEventListener('hashchange', route);
  route();
}
async function loadPrincipals() {
  state.principals = await api('/api/principals');
  const sel = $('#principal');
  sel.innerHTML = state.principals.map((p) => `<option value="${esc(p.id)}">${esc(p.display_name)}</option>`).join('');
  state.principal = state.principals[0]?.id ?? null;
  sel.value = state.principal ?? '';
  sel.onchange = () => { state.principal = sel.value; paintMe(); route(); };
  paintMe();
}
function paintMe() {
  const p = state.principals.find((x) => x.id === state.principal);
  $('#wsAvatar').textContent = initials(p?.display_name);
  $('#meAvatar').textContent = initials(p?.display_name);
  $('#meName').textContent = p?.display_name ?? '—';
  $('#meSub').textContent = p ? `${p.timezone} · somente leitura` : 'somente leitura';
}

async function route() {
  const [, r = 'hoje', id] = location.hash.split('/');
  document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', a.dataset.r === (r === 'insight' ? 'hoje' : r)));
  const main = $('#main');
  try {
    if (r === 'insight' && id) main.innerHTML = await viewInsight(id);
    else if (r === 'aprovacoes') main.innerHTML = await viewApprovals();
    else if (r === 'atividade') main.innerHTML = await viewActivity();
    else if (r === 'pessoas') main.innerHTML = await viewPeople(id);
    else if (r === 'ontologia') { main.innerHTML = await viewOntology(); }
    else if (r === 'integracoes') main.innerHTML = viewIntegrations();
    else if (r === 'auditoria') main.innerHTML = await viewAudit();
    else if (r === 'configuracao') main.innerHTML = await viewConfig();
    else main.innerHTML = await viewToday();
    bind();
    if (r === 'ontologia') startOntology();
    if (r === 'insight') drawLogic();
  } catch (e) {
    main.innerHTML = head('Erro', '') + `<div class="canvas"><div class="card empty"><h3>Não foi possível carregar</h3>${esc(e.message)}</div></div>`;
  }
  window.scrollTo(0, 0);
}

const k0 = (n) => String(n ?? 0);
function playCard(i, n) {
  const [tag, tcls] = EVENT_TAG[i.event_type] ?? [i.event_type, ''];
  const claims = i.claims ?? [];
  const lead = claims.find((c) => c.kind === 'ANTICIPATION') ?? claims.find((c) => c.kind === 'INFERENCE');
  const avgConf = claims.length ? claims.reduce((s, c) => s + c.confidence, 0) / claims.length : 0;
  const acts = i.actions ?? [];
  const waiting = acts.filter((a) => a.state === 'AWAITING_APPROVAL').length;
  const done = acts.filter((a) => a.state === 'VERIFIED').length;
  return `<a class="card play" href="#/insight/${esc(i.id)}">
    <div class="rank ${n === 1 ? 'first' : ''}">${String(n).padStart(2, '0')}</div>
    <div>
      <div class="tags"><span class="tag ${tcls}">${esc(tag)}</span><span class="dots">${confDots(avgConf)}</span><span>${conf(avgConf)}</span><span>· prioridade ${i.score.toFixed(2)}</span>${i.test_double ? '<span class="tag warn">substituto de teste</span>' : ''}</div>
      <h3>${esc(i.headline)}</h3>
      ${lead ? `<div class="lead">${ICON.trend}<span>${esc(lead.statement)}</span></div>` : ''}
      ${i.narrative ? `<div class="body">${esc(stripRefs(i.narrative))}</div>` : ''}
      ${(i.cited ?? []).length ? `<div class="chips">${i.cited.filter((c) => c.kind !== 'event').slice(0, 5).map((c) => `<span class="chip"><i>${esc(c.kind === 'message' ? 'e-mail' : c.kind === 'meeting' ? 'reunião' : c.kind === 'commitment' ? 'compromisso' : c.kind === 'person' ? 'pessoa' : c.kind === 'memory' ? 'memória' : c.kind)}</i>${esc(c.label ?? c.handle)}</span>`).join('')}</div>` : ''}
      <div class="play-foot"><span>${done ? `${done} preparado(s)` : ''}${done && waiting ? ' · ' : ''}${waiting ? `${waiting} aguardando você` : ''}${!done && !waiting ? 'nenhuma ação proposta' : ''}</span><span class="btn ${waiting ? 'primary' : ''}">${waiting ? 'Revisar' : 'Abrir'} ${ICON.arrow}</span></div>
    </div></a>`;

function miniRow(i) {

let factLabels = {};
const factLabel = (f) => { const e = f.evidence[0]; return (e && factLabels[`${e.kind}:${e.id}`]) || f.statement.split('\n')[0]; };
let insightView = 'summary';
let logicData = null;

    <div class="note">Prioridade ${Number(ins.salience.score).toFixed(2)} · limiar ${ins.salience.threshold}. Passe o mouse para ver a origem de cada fator.</div></div>`;
  h += `<div class="card"><h4>${ICON.shield} Rastreabilidade</h4>
    <div class="line"><span class="l">Modelo</span><span class="v">${esc([...new Set(calls.map((c) => c.served_by_model || c.model))].join(', ') || '—')}</span></div>

    <div class="line"><span class="l">Fatos citados</span><span class="v">${facts.length}</span></div>

    <div class="row-btns"><a class="btn" href="/tecnico#schema=${esc(state.schema)}&event=${esc(ins.event_id)}">Ver raciocínio técnico ${ICON.arrow}</a></div></div>`;
  h += `</div></div></div></div>`;
  return h;
}
function logicHtml(claims) {
  const valid = claims.filter((c) => c.validation_status === 'VALID');
  const cols = [
    ['Fatos · fontes', valid.filter((c) => c.kind === 'FACT')],
    ['Inferências', valid.filter((c) => c.kind === 'INFERENCE')],
    ['Antecipações e hipóteses', valid.filter((c) => c.kind === 'ANTICIPATION' || c.kind === 'HYPOTHESIS')],
    ['Recomendações', valid.filter((c) => c.kind === 'RECOMMENDATION')],
  ];
  return `<div class="card logic" id="logic"><svg class="links" id="logicLinks"></svg><div class="lcols">${cols
    .map(([title, list]) => `<div class="lcol"><h5>${title} · ${list.length}</h5>${list
      .map((c) => `<div class="node ${c.kind === 'FACT' ? 'fact' : c.kind === 'RECOMMENDATION' ? 'rec' : ''}" data-ord="${c.ordinal}"><div class="k"><span>${esc(c.kind === 'FACT' ? c.evidence.map((e) => e.handle).join(' ') : c.label)}</span><span>${c.kind === 'FACT' ? 'fonte' : Number(c.confidence).toFixed(2)}</span></div>${esc((c.kind === 'FACT' ? factLabel(c) : c.statement).slice(0, 160))}</div>`)
      .join('') || '<div class="note">—</div>'}</div>`)
    .join('')}</div></div>
    <div class="note" style="margin-top:8px">Cada linha liga uma afirmação ao que a sustenta. Fatos são gerados pelo código a partir dos registros; o resto vem do raciocínio e passou pela validação.</div>`;
}
function drawLogic() {
  const box = document.getElementById('logic'), svg = document.getElementById('logicLinks');
  if (!box || !svg || !logicData) return;
  const b = box.getBoundingClientRect();
  const pos = {};
  box.querySelectorAll('.node').forEach((n) => { const r = n.getBoundingClientRect(); pos[n.dataset.ord] = { l: r.left - b.left, r: r.right - b.left, y: r.top - b.top + r.height / 2 }; });
  let paths = '';
  for (const c of logicData.claims) {
    const to = pos[c.ordinal];
    if (!to) continue;
    for (const o of c.derived_from) {
      const from = pos[o];
      if (!from) continue;
      const x1 = from.r, x2 = to.l, mx = (x1 + x2) / 2;
      if (x2 <= x1) continue;
      paths += `<path d="M${x1} ${from.y} C${mx} ${from.y}, ${mx} ${to.y}, ${x2} ${to.y}"/>`;
    }
  }
  svg.innerHTML = paths;
}
window.addEventListener('resize', () => drawLogic());

}

let onto = null;
async function viewOntology() {

  return h + '</div></div>';
}
function startOntology() {
  const svg = document.getElementById('ontoSvg');
  if (!svg || !onto) return;
  const W = svg.clientWidth || 1000, H = svg.clientHeight || 640;
  const nodes = onto.nodes.map((n) => ({ ...n }));
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const edges = onto.edges.map((e) => ({ ...e, s: byId[e.source], t: byId[e.target] })).filter((e) => e.s && e.t);
  const ring = { principal: 0, person: 1, organization: 2, meeting: 1.6, commitment: 1.7, memory: 2.1, insight: 1.9 };
  nodes.forEach((n, i) => { const a = (i / nodes.length) * Math.PI * 2; const r = (ring[n.type] ?? 2) * Math.min(W, H) * 0.2; n.x = W / 2 + Math.cos(a) * r; n.y = H / 2 + Math.sin(a) * r; n.vx = 0; n.vy = 0; });
  const center = nodes.find((n) => n.type === 'principal');
  if (center) { center.x = W / 2; center.y = H / 2; center.fixed = true; }
  for (let it = 0; it < 320; it++) {
    const k = 1 - it / 320;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j]; let dx = b.x - a.x, dy = b.y - a.y; const d2 = dx * dx + dy * dy + 0.01; const f = 5200 / d2; const d = Math.sqrt(d2);
      dx /= d; dy /= d; a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
    for (const e of edges) { let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y; const d = Math.sqrt(dx * dx + dy * dy) || 1; const f = (d - 120) * 0.02; dx /= d; dy /= d; e.s.vx += dx * f; e.s.vy += dy * f; e.t.vx -= dx * f; e.t.vy -= dy * f; }
    for (const n of nodes) { n.vx += (W / 2 - n.x) * 0.002; n.vy += (H / 2 - n.y) * 0.002; if (!n.fixed) { n.x += Math.max(-12, Math.min(12, n.vx)) * k; n.y += Math.max(-12, Math.min(12, n.vy)) * k; } n.vx *= 0.5; n.vy *= 0.5; }
  }
  let vb = { x: 0, y: 0, w: W, h: H };
  const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  setVB();
  const short = (t, n = 26) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
  function render() {
    const vis = (n) => !onto.hidden.has(n.type);
    const sel = onto.sel;
    const nbr = new Set();
    if (sel) for (const e of edges) { if (e.s.id === sel) nbr.add(e.t.id); if (e.t.id === sel) nbr.add(e.s.id); }
    const fewEdges = edges.length <= 24;
    let out = '<g>';
    for (const e of edges) {
      if (!vis(e.s) || !vis(e.t)) continue;
      const hi = sel && (e.s.id === sel || e.t.id === sel);
      out += `<line class="edge ${hi ? 'hi' : ''}" x1="${e.s.x}" y1="${e.s.y}" x2="${e.t.x}" y2="${e.t.y}"/>`;
    }
    for (const e of edges) {
      if (!vis(e.s) || !vis(e.t)) continue;
      const hi = sel && (e.s.id === sel || e.t.id === sel);
      const mx = (e.s.x + e.t.x) / 2, my = (e.s.y + e.t.y) / 2, w = e.label.length * 6.2 + 14;
      out += `<g class="elabel ${hi || (!sel && fewEdges) ? 'show' : ''}" transform="translate(${mx},${my})"><rect x="${-w / 2}" y="-9" width="${w}" height="18" rx="9"/><text text-anchor="middle" y="3.5">${esc(e.label)}</text></g>`;
    }
    for (const n of nodes) {
      if (!vis(n)) continue;
      const r = n.type === 'principal' ? 22 : 17;
      const dim = sel && n.id !== sel && !nbr.has(n.id);
      out += `<g class="n ${n.type} ${n.id === sel ? 'sel' : ''} ${dim ? 'dim' : ''}" data-id="${esc(n.id)}" transform="translate(${n.x},${n.y})">
        <circle class="o" r="${r}"/><g class="glyph" transform="translate(-9,-9) scale(.75)">${OTYPE[n.type]?.g ?? ''}</g>
        <text text-anchor="middle" y="${r + 14}">${esc(short(n.label))}</text></g>`;
    }
    svg.innerHTML = out + '</g>';
  }
  function showCard(n) {
    const card = document.getElementById('ocard');
    if (!n) { card.hidden = true; return; }
    const idx = nodes.filter((x) => x.type === n.type).indexOf(n) + 1;
    const fmt = (v) => (v == null || v === '' ? '—' : typeof v === 'number' ? (Number.isInteger(v) ? String(v) : v.toFixed(2)) : /^\d{4}-\d{2}-\d{2}T/.test(String(v)) ? fmtDate(v) : String(v));
    const raw = n.id.split(':')[1];
    const link = n.type === 'insight' ? `#/insight/${raw}` : n.type === 'person' ? `#/pessoas/${raw}` : null;
    card.innerHTML = `<div class="h"><span>${esc(OTYPE[n.type]?.pt ?? n.type)} №${String(idx).padStart(2, '0')}</span><a href="#/ontologia" id="ocardX">×</a></div>
      <div class="t">${esc(n.label)}</div>
      ${Object.entries(n.props).map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span title="${esc(fmt(v))}">${esc(fmt(v))}</span></div>`).join('')}
      <div class="row"><span>ligações</span><span>${edges.filter((e) => e.s === n || e.t === n).length}</span></div>
      ${link ? `<div class="row-btns"><a class="btn mint" href="${link}">Abrir ${ICON.arrow}</a></div>` : ''}`;
    card.hidden = false;
    document.getElementById('ocardX').onclick = (ev) => { ev.preventDefault(); onto.sel = null; showCard(null); render(); };
  }
  render();
  // interactions: pan, zoom, drag node, select
  let drag = null;
  const pt = (ev) => { const r = svg.getBoundingClientRect(); return { x: vb.x + ((ev.clientX - r.left) / r.width) * vb.w, y: vb.y + ((ev.clientY - r.top) / r.height) * vb.h }; };
  svg.onmousedown = (ev) => {
    const g = ev.target.closest('.n');
    drag = g ? { node: byId[g.dataset.id], moved: false } : { pan: true, sx: ev.clientX, sy: ev.clientY, vb: { ...vb }, moved: false };
  };
  window.onmousemove = (ev) => {
    if (!drag) return;
    drag.moved = true;
    if (drag.node) { const p = pt(ev); drag.node.x = p.x; drag.node.y = p.y; render(); }
    else { const r = svg.getBoundingClientRect(); vb.x = drag.vb.x - ((ev.clientX - drag.sx) / r.width) * vb.w; vb.y = drag.vb.y - ((ev.clientY - drag.sy) / r.height) * vb.h; setVB(); }
  };
  window.onmouseup = () => {
    if (drag && !drag.moved) { if (drag.node) { onto.sel = onto.sel === drag.node.id ? null : drag.node.id; showCard(onto.sel ? drag.node : null); } else { onto.sel = null; showCard(null); } render(); }
    drag = null;
  };
  svg.onwheel = (ev) => { ev.preventDefault(); const p = pt(ev); const f = ev.deltaY > 0 ? 1.1 : 0.9; vb = { x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: vb.w * f, h: vb.h * f }; setVB(); };
  document.querySelectorAll('[data-otype]').forEach((b) => (b.onclick = () => { const t = b.dataset.otype; onto.hidden.has(t) ? onto.hidden.delete(t) : onto.hidden.add(t); b.classList.toggle('off'); render(); }));
}

async function viewPeople(selectedId) {
  const { people, memories } = await api('/api/people');

  h += `<div class="kpis" style="margin-top:0"><div class="kpi"><div class="v">${people.length}</div><div class="l">pessoas</div></div><div class="kpi"><div class="v">${people.filter((p) => p.explicit_importance >= 0.7).length}</div><div class="l">importantes</div><div class="s">definidas por você</div></div><div class="kpi"><div class="v">${memories.length}</div><div class="l">memórias</div><div class="s">${memories.filter((m) => m.written_by === 'WENDY').length} aprendidas pela Wendy</div></div><div class="kpi"><div class="v">${people.reduce((s, p) => s + p.open_commitments, 0)}</div><div class="l">compromissos abertos</div></div></div>`;
  if (!people.length) return h + `<div class="card empty">${illo('nodes', 150)}<h3>Nenhuma pessoa ainda</h3></div></div></div>`;
  h += `<div class="split"><div class="card plist">${people.map((p) => `<a class="p ${p.id === sel.id ? 'on' : ''}" href="#/pessoas/${esc(p.id)}"><div class="ttl">${esc(p.full_name)}</div><div class="sub">${esc([p.title, p.organization].filter(Boolean).join(' · ') || p.emails || '')}</div></a>`).join('')}</div><div class="card" style="padding:18px 22px">`;
  const mine = memories.filter((m) => m.subject_person_id === sel.id);
  h += `<div class="eyebrow">${esc(sel.relationship ? (REL_PT[sel.relationship] ?? sel.relationship) : 'sem relação registrada')}</div><h2 style="margin:4px 0 2px;font-size:20px">${esc(sel.full_name)}</h2><div class="muted">${esc([sel.title, sel.organization, sel.emails].filter(Boolean).join(' · '))}</div>
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin:16px 0"><div class="kpi"><div class="v" style="font-size:22px">${sel.explicit_importance != null ? Number(sel.explicit_importance).toFixed(2) : '—'}</div><div class="s">importância (sua)</div></div><div class="kpi"><div class="v" style="font-size:22px">${sel.interactions_90d}</div><div class="s">interações · 90 dias</div></div><div class="kpi"><div class="v" style="font-size:22px">${sel.last_interaction ? fmtDay(sel.last_interaction) : '—'}</div><div class="s">última interação</div></div><div class="kpi"><div class="v" style="font-size:22px">${sel.birthdate ? fmtDay(sel.birthdate + 'T12:00:00') : '—'}</div><div class="s">aniversário</div></div></div>`;
  h += `<div class="eyebrow" style="margin-top:6px">O que a Wendy lembra</div>`;
  h += mine.length ? mine.map(memRow).join('') : '<div class="empty-line">Nenhuma memória sobre esta pessoa ainda.</div>';
  if (principalMem.length) h += `<div class="eyebrow" style="margin-top:20px">Suas preferências gerais</div>${principalMem.map(memRow).join('')}`;
  return h + `<div class="note" style="margin-top:14px">Fonte do registro: ${esc(sel.source)}</div></div></div></div></div>`;
}
function memRow(m) {
  const who = m.written_by === 'WENDY' ? 'aprendida pela Wendy' : m.written_by === 'PRINCIPAL' ? 'dita por você' : 'registro do sistema';
  return `<div class="claim" style="padding:10px 0;border-bottom:1px solid var(--line-2)"><div class="s">${esc(m.content)}</div><div class="m">${esc(m.kind.toLowerCase())} · ${who} · confiança ${Number(m.confidence).toFixed(2)} · ${fmtDay(m.created_at)}${m.status !== 'ACTIVE' ? ` · ${esc(m.status)}` : ''}${(m.evidence || []).length ? ` · ${m.evidence.length} fonte(s)` : ' · sem fonte registrada'}</div></div>`;
}

  <div class="right"><div class="summary">
    <div class="top"><b>${esc(p?.display_name ?? '—')}</b><span class="tag">${esc(c.model)}</span></div>
    <div class="big"><div class="eyebrow">Monitoramento contínuo</div><div class="v">${c.important.length} pessoas</div><div class="muted small">${imp.length} com importância definida · ${c.policy.length} tipos de ação</div></div>
    <div class="row"><span>Fuso</span><span>${esc(p?.timezone ?? '—')}</span></div>
    <div class="row"><span>Idioma</span><span>${esc(p?.locale ?? '—')}</span></div>
    <div class="row"><span>Faz sozinha</span><span>${c.policy.filter((x) => x.decision.mode === 'AUTO').map((x) => ACTION_NAME[x.type] ?? x.type).join(', ') || '—'}</span></div>
    <div class="row"><span>Pede aprovação</span><span style="color:var(--warn)">${c.policy.filter((x) => x.decision.mode !== 'AUTO').map((x) => ACTION_NAME[x.type] ?? x.type).join(', ') || '—'}</span></div>
    <div class="row"><span>Interrompe a partir de</span><span>prioridade ${c.salience.threshold}</span></div>
    <div class="row"><span>Fontes reais</span><span class="muted">nenhuma ainda</span></div>
  </div></div></div>`;
  return h;
}

/* ---------- AUDITORIA ---------- */
async function viewAudit() {
  const [led, calls] = await Promise.all([api('/api/ledger'), api('/api/model-calls')]);
  const real = calls.filter((c) => c.model !== 'TEST_DOUBLE').length;
  let h = head('Auditoria', 'Integridade do registro, chamadas ao modelo e raciocínio técnico', `<a class="btn" href="/tecnico#schema=${esc(state.schema)}">Visão técnica completa ${ICON.arrow}</a>`);
  h += `<div class="canvas"><div class="wrap">`;
  h += `<div class="kpis" style="margin-top:0"><div class="kpi"><div class="v" style="color:${led.integrity.valid ? 'var(--mint)' : 'var(--bad)'}">${led.integrity.valid ? 'Íntegro' : 'Falha'}</div><div class="l">ledger de auditoria</div><div class="s">${led.integrity.valid ? `${led.integrity.blockCount} blocos verificados` : esc(led.integrity.error)}</div></div>
    <div class="kpi"><div class="v">${calls.length}</div><div class="l">chamadas ao modelo</div><div class="s">${real} reais · ${calls.length - real} substituto de teste</div></div>
    <div class="kpi"><div class="v">${calls.filter((c) => c.error).length}</div><div class="l">chamadas com erro</div></div>
    <div class="kpi"><div class="v">${calls.reduce((s, c) => s + (c.usage?.input_tokens ?? 0) + (c.usage?.output_tokens ?? 0), 0).toLocaleString('pt-BR')}</div><div class="l">tokens usados</div><div class="s">somente chamadas reais</div></div></div>`;
  h += `<div class="card" style="margin-bottom:22px"><div class="toolbar"><b>Chamadas ao modelo</b></div>${calls.length ? `<table><thead><tr><th>Etapa</th><th>Modelo</th><th>ID da API</th><th class="num">Evidências enviadas</th><th class="num">Quando</th></tr></thead><tbody>${calls.slice(0, 50).map((c) => `<tr><td>${esc(c.purpose)}</td><td>${c.model === 'TEST_DOUBLE' ? '<span class="pill warn">substituto de teste</span>' : esc(c.served_by_model || c.model)}${c.error ? ` <span class="pill bad">erro</span>` : ''}</td><td class="mono muted">${esc(c.api_message_id ?? '—')}</td><td class="num">${esc(c.evidence_sent)}</td><td class="num muted">${fmtDate(c.started_at)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nenhuma chamada.</div>'}</div>`;
  h += `<div class="card"><div class="toolbar"><b>Ledger · últimos blocos</b><span class="muted small">cada mudança de estado relevante, encadeada por hash</span></div><table><thead><tr><th class="num" style="width:60px">#</th><th>Evento</th><th>Ator</th><th>Hash</th><th class="num">Quando</th></tr></thead><tbody>${led.blocks.slice(0, 40).map((b) => `<tr><td class="num muted">${b.seq}</td><td>${esc(b.event_type)}</td><td class="muted">${esc(b.actor)}</td><td class="mono muted">${esc(b.hash.slice(0, 16))}…</td><td class="num muted">${fmtDate(b.at)}</td></tr>`).join('')}</tbody></table></div>`;
  return h + '</div></div>';
}

function bind() {
  document.querySelectorAll('[data-iview]').forEach((b) => (b.onclick = () => { insightView = insightView === b.dataset.iview ? 'summary' : b.dataset.iview; route(); }));
  document.querySelectorAll('[data-filter]').forEach((b) => (b.onclick = () => { approvalsFilter = b.dataset.filter; route(); }));
  document.querySelectorAll('[data-afilter]').forEach((b) => (b.onclick = () => { activityFilter = b.dataset.afilter; route(); }));
  document.querySelectorAll('tr[data-href]').forEach((tr) => (tr.onclick = () => (location.hash = tr.dataset.href)));
  const box = $('#evbox');
  document.querySelectorAll('[data-ev]').forEach((b) => (b.onclick = () => {
    const f = evidenceIndex[b.dataset.ev];
    if (!f || !box) return;
    const same = box.dataset.cur === b.dataset.ev && box.classList.contains('show');
    box.classList.toggle('show', !same);
    box.dataset.cur = b.dataset.ev;
    box.textContent = f.statement;
    if (!same) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }));
}

boot().catch((e) => ($('#main').innerHTML = `<div class="canvas"><div class="card empty"><h3>Erro</h3>${esc(e.message)}</div></div>`));
</script>
</body>
